openapi: 3.1.0
info:
  title: Kalatori Merchant API
  version: 3.0.0
  description: |
    Kalatori Merchant API V3 - Self-hosted, non-custodial blockchain payment gateway for processing crypto payments on Polkadot's Asset Hub.

    **Note:** This specification describes the API contract only. It defines what operations are available
    and how to interact with the API, but does not document internal implementation details or server-side
    processing logic. For implementation documentation, refer to the project's technical documentation.

    ## Overview

    This API allows merchants to:
    - Create payment invoices for cryptocurrency payments
    - Monitor invoice status and received payments
    - Integrate with e-commerce platforms (WooCommerce, Shopify, Magento, etc.)

    ## Authentication

    All API requests to `/private` handlers require HMAC-SHA256 signature authentication using two headers:

    ```
    X-Kalatori-Signature: <hmac_sha256_hex_signature>
    X-Kalatori-Timestamp: <unix_timestamp_seconds>
    ```

    **Signature Calculation:**

    The signature is created by concatenating specific request components with newline delimiters and signing with HMAC-SHA256:

    ```
    signed_payload = HTTP_METHOD + "\n" + URL + "\n" + body_or_query + "\n" + timestamp
    signature = HMAC_SHA256(secret, signed_payload)
    ```

    **Components:**

    - `HTTP_METHOD` = Request method in uppercase (e.g., "GET", "POST", "PATCH")
    - `URL` = Full path without query string (e.g., "/private/v3/invoice/get")
    - `body_or_query` = Either:
      - For POST/PATCH: Raw JSON request body as string
      - For GET: Query parameters sorted alphabetically by key (e.g., "amount=100.00&order_id=order-123"), or empty string if no parameters
    - `timestamp` = Unix timestamp in seconds from X-Kalatori-Timestamp header

    **Query Parameter Sorting:**

    To ensure consistent signatures regardless of parameter order in the original URL, query parameters must be:
    1. Sorted alphabetically by parameter name (case-sensitive)
    2. Formatted as `key=value` pairs joined with `&`
    3. URL-encoded values (if necessary)
    4. Exclude the `?` prefix

    Example: URL `?order_id=order-123&amount=100.00` becomes `amount=100.00&order_id=order-123`

    **Example (POST with body):**
    ```javascript
    const method = "POST";
    const url = "/private/v3/invoice/create";
    const body = '{"order_id":"order-123","amount":"100.00"}';
    const timestamp = "1731585330";

    // Concatenate components with newline delimiters
    const signedPayload = method + "\n" + url + "\n" + body + "\n" + timestamp;
    // Result: "POST\n/private/v3/invoice/create\n{\"order_id\":\"order-123\",\"amount\":\"100.00\"}\n1731585330"

    const signature = hmac_sha256(secret, signedPayload);
    ```

    **Example (GET with query parameters):**
    ```javascript
    const method = "GET";
    const url = "/private/v3/invoice/get";
    // Note: parameters sorted alphabetically by key, without '?' prefix
    const queryString = "include_transactions=true&invoice_id=a1b2c3d4-e5f6-7890";
    const timestamp = "1731585330";

    // Concatenate components with newline delimiters
    const signedPayload = method + "\n" + url + "\n" + queryString + "\n" + timestamp;
    // Result: "GET\n/private/v3/invoice/get\ninclude_transactions=true&invoice_id=a1b2c3d4-e5f6-7890\n1731585330"

    const signature = hmac_sha256(secret, signedPayload);
    ```

    **Example (GET without query parameters):**
    ```javascript
    const method = "GET";
    const url = "/private/v3/some/endpoint";
    const queryString = ""; // No parameters
    const timestamp = "1731585330";

    // Concatenate components with newline delimiters
    const signedPayload = method + "\n" + url + "\n" + queryString + "\n" + timestamp;
    // Result: "GET\n/private/v3/some/endpoint\n\n1731585330"

    const signature = hmac_sha256(secret, signedPayload);
    ```

    **Timestamp Validation:**
    - Timestamp must be within ±5 minutes (300 seconds) of server time
    - Prevents replay attacks
    - Use constant-time comparison for signature verification

    **HMAC Secret:**
    - Configured in Kalatori config file
    - Keep secret secure and never expose in client-side code

    **Important:** All API requests require authentication. Requests without valid signatures will receive a `401 Unauthorized` response.

    ## Data Formats

    **UUID Format:**
    - All UUIDs follow RFC 4122 standard (version 4)
    - Represented as lowercase strings with hyphens: `"01234567-89ab-cdef-0123-456789abcdef"`
    - Used for: `invoice_id`, `transaction_id`

    **Date/Time Format:**
    - All timestamps use ISO 8601 format in UTC timezone
    - Format: `YYYY-MM-DDTHH:mm:ss.SSSZ`
    - Example: `"2025-11-14T12:00:00.000Z"`
    - Used for: `created_at`, `updated_at`, `valid_till`

    **Monetary Amounts:**
    - Represented as decimal strings for precision (never use floating point)
    - Pattern: `^\d+(\.\d+)?$`
    - Examples: `"100.50"`, `"0.07"`, `"1000"`
    - Used for: `amount`, `price`, `tax`, `discount`, `total_received_amount`

    **Enum Values:**
    - Status values use PascalCase: `"Waiting"`, `"Paid"`, `"PartiallyPaid"`, `"AdminCanceled"`
    - Transaction types use PascalCase: `"Incoming"`, `"Outgoing"`
    - Error types use snake_case: `"authentication_error"`, `"invalid_request_error"`
    - Webhook events use snake_case with dot notation: `"invoice.paid"`, `"invoice.admin_canceled"`

    **Character Encoding:**
    - All requests and responses use UTF-8 encoding
    - Content-Type header: `application/json; charset=utf-8`


    ## Response Structure

    All responses follow a consistent structure:

    **Success responses (2xx):**
    ```
    HTTP/1.1 200 OK
    X-Request-Id: req_abc123xyz

    {
      "result": { /* response data */ }
    }
    ```

    **Error responses (4xx/5xx):**
    ```
    HTTP/1.1 400 Bad Request
    X-Request-Id: req_abc123xyz

    {
      "error": {
        "type": "error_type",
        "code": "error_code",
        "message": "Human-readable error message",
        "param": "parameter_name"
      }
    }
    ```

    **Request ID Header:**
    - All responses include an `X-Request-Id` header
    - Use this ID when contacting support or debugging issues
    - Server logs include this ID for correlation

    ## Webhooks

    Webhook URL and events are configured in the daemon config file (not managed through this API).
    All webhook payloads are signed using HMAC-SHA256 and sent as POST requests to your configured webhook URL.

    **Webhook Signature Calculation:**

    The signature is created by concatenating components with newline delimiters:

    ```
    signed_payload = HTTP_METHOD + "\n" + URL + "\n" + body + "\n" + event_type + "\n" + timestamp
    signature = HMAC_SHA256(secret, signed_payload)
    ```

    **Components:**
    - `HTTP_METHOD` = Always "POST" for webhooks
    - `URL` = Your configured webhook endpoint path (e.g., "/webhooks/kalatori")
    - `body` = Raw JSON webhook payload as string
    - `event_type` = Event type (e.g., "invoice.paid", "invoice.canceled")
    - `timestamp` = Unix timestamp in seconds from X-Kalatori-Timestamp header

    **Example:**
    ```javascript
    const method = "POST";
    const url = "/webhooks/kalatori";
    const body = '{"invoice_id":"01234567-89ab-cdef-0123-456789abcdef","status":"Paid"}';
    const eventType = "invoice.paid";
    const timestamp = "1731585330";

    // Concatenate components with newline delimiters
    const signedPayload = method + "\n" + url + "\n" + body + "\n" + eventType + "\n" + timestamp;
    // Result: "POST\n/webhooks/kalatori\n{\"invoice_id\":\"01234567-89ab-cdef-0123-456789abcdef\",\"status\":\"Paid\"}\ninvoice.paid\n1731585330"

    const signature = hmac_sha256(secret, signedPayload);
    // Verify signature matches X-Kalatori-Signature header
    ```

    **Headers sent with webhook requests:**
    - `X-Kalatori-Signature`: HMAC signature (hex)
    - `X-Kalatori-Timestamp`: Unix timestamp in seconds (integer)

    **Verification:**
    - Verify timestamp is within ±5 minutes to prevent replay attacks
    - Use constant-time comparison for signature verification

    **Webhook Events:**
    - `invoice.created`, `invoice.partially_paid`
    - `invoice.paid`, `invoice.overpaid`
    - `invoice.unpaid_expired`, `invoice.partially_paid_expired`
    - `invoice.customer_canceled`, `invoice.admin_canceled`
  contact:
    name: Kalatori Support
    url: https://github.com/Kalapaja/kalatori
