servers:
  - url: http://localhost:16726
    description: Local development server
  - url: https://api.kalatori.example.com
    description: Production server (example)

security:
  - HmacAuth: []

tags:
  - name: Invoices
    description: Invoice creation, retrieval, and management operations
  - name: Refunds
    description: Refund initiation and tracking operations
  - name: Transactions
    description: Transaction retrieval and monitoring operations

paths:
  /v3/invoice:
    get:
      tags:
        - Invoices
      summary: Get invoice by ID
      description: |
        Retrieve a single invoice by invoice_id or order_id.
        If both parameters are provided, invoice_id takes priority.
        If neither parameter is provided, returns 400 error.
      operationId: getInvoice
      parameters:
        - name: invoice_id
          in: query
          description: The Kalatori-generated invoice UUID
          required: false
          schema:
            type: string
            format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
        - name: order_id
          in: query
          description: The merchant's order ID
          required: false
          schema:
            type: string
            maxLength: 255
          example: "shop-order-12345"
        - name: include_transactions
          in: query
          description: Include incoming payment transactions in response (excludes refund and settlement transactions)
          required: false
          schema:
            type: boolean
            default: false
        - name: include_refunds
          in: query
          description: Include full refund objects in response
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Invoice retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique request identifier for debugging
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
              examples:
                waiting:
                  summary: Invoice waiting for payment
                  value:
                    result:
                      id: "01234567-89ab-cdef-0123-456789abcdef"
                      order_id: "shop-order-12345"
                      amount: "100.50"
                      asset: "USDC"
                      status: "waiting"
                      payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                      payment_url: "https://mega-merchant.kalatori.org/01234567-89ab-cdef-0123-456789abcdef"
                      valid_till: "2025-11-15T12:00:00.000Z"
                      cart:
                        - name: "Premium Widget"
                          quantity: 2
                          price: "45.00"
                        - name: "Shipping"
                          quantity: 1
                          price: "10.50"
                      callback_url: "https://myshop.com/webhooks/kalatori"
                      total_received: "0.00"
                      refunds_ids: []
                      transactions: []
                      created_at: "2025-11-14T12:00:00.000Z"
                      updated_at: "2025-11-14T12:00:00.000Z"
                paid:
                  summary: Invoice paid
                  value:
                    result:
                      id: "01234567-89ab-cdef-0123-456789abcdef"
                      order_id: "shop-order-12345"
                      amount: "100.50"
                      asset: "USDC"
                      status: "paid"
                      payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                      payment_url: "https://mega-merchant.kalatori.org/01234567-89ab-cdef-0123-456789abcdef"
                      valid_till: "2025-11-15T12:00:00.000Z"
                      cart:
                        - name: "Premium Widget"
                          quantity: 2
                          price: "45.00"
                        - name: "Shipping"
                          quantity: 1
                          price: "10.50"
                      callback_url: "https://myshop.com/webhooks/kalatori"
                      total_received: "100.50"
                      refunds_ids: []
                      created_at: "2025-11-14T12:00:00.000Z"
                      updated_at: "2025-11-14T12:15:30.000Z"
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_param:
                  summary: Missing required parameter
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "missing_parameter"
                      message: "Either invoice_id or order_id must be provided"
                multiple_params:
                  summary: Multiple parameters provided
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "too_many_parameters"
                      message: "Only one of invoice_id or order_id can be specified"
                invalid_uuid:
                  summary: Malformed UUID
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_parameter"
                      message: "invoice_id must be a valid UUID"
                      param: "invoice_id"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  type: "invalid_request_error"
                  code: "invoice_not_found"
                  message: "No invoice found with the provided ID"
                  param: "invoice_id"
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - Invoices
      summary: Create new invoice
      description: |
        Create a new payment invoice. The invoice_id (UUID) is generated by Kalatori, while order_id is provided by the merchant.

        **Idempotency:** Include an `Idempotency-Key` header to safely retry requests.

        **Validation:**
        - Amount must be >= existential deposit (typically 0.07 for most assets)
        - No other invoice with the same order_id can exist (order_id must be globally unique)
      operationId: createInvoice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
            examples:
              minimal:
                summary: Minimal invoice creation
                value:
                  order_id: "shop-order-12345"
                  amount: "100.50"
              with_cart:
                summary: Invoice with cart items (including optional fields)
                value:
                  order_id: "shop-order-12346"
                  amount: "250.00"
                  cart:
                    - name: "Premium Widget"
                      quantity: 2
                      price: "100.00"
                      sku: "WGT-PREM-001"
                      product_id: "prod_abc123"
                      variant_id: "var_blue_large"
                      image_url: "https://myshop.com/images/premium-widget.jpg"
                      tax: "20.00"
                      discount: "10.00"
                    - name: "Standard Widget"
                      quantity: 5
                      price: "10.00"
                      sku: "WGT-STD-002"
                      product_id: "prod_xyz789"
                  callback_url: "https://myshop.com/webhooks/kalatori"
      responses:
        '201':
          description: Invoice created successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique request identifier
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
              example:
                result:
                  id: "01234567-89ab-cdef-0123-456789abcdef"
                  order_id: "shop-order-12345"
                  amount: "100.50"
                  asset: "USDC"
                  status: "waiting"
                  payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                  payment_url: "https://mega-merchant.kalatori.org/01234567-89ab-cdef-0123-456789abcdef"
                  valid_till: "2025-11-15T12:00:00.000Z"
                  cart:
                    - name: "Premium Widget"
                      quantity: 2
                      price: "45.00"
                      sku: "WGT-PREM-001"
                      product_id: "prod_abc123"
                      image_url: "https://myshop.com/images/premium-widget.jpg"
                      tax: "4.50"
                    - name: "Shipping"
                      quantity: 1
                      price: "10.50"
                  callback_url: "https://myshop.com/webhooks/kalatori"
                  total_received: "0.00"
                  refunds_ids: []
                  transactions: []
                  created_at: "2025-11-14T12:00:00.000Z"
                  updated_at: "2025-11-14T12:00:00.000Z"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                amount_too_low:
                  summary: Amount below existential deposit
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "amount_too_low"
                      message: "Amount must be at least 0.07 USDC to cover existential deposit"
                      param: "amount"
                validation_failed:
                  summary: Multiple validation errors
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "validation_failed"
                      message: "Request validation failed"
                      validation_errors:
                        - param: "order_id"
                          message: "order_id cannot be empty"
                        - param: "amount"
                          message: "amount must be a positive number"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Conflict - duplicate order_id or idempotency key mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicate_order:
                  summary: Order ID already exists
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "duplicate_order_id"
                      message: "An invoice with order_id 'shop-order-12345' already exists"
                      param: "order_id"
                      details:
                        existing_invoice_id: "fedcba98-7654-3210-fedc-ba9876543210"
                        existing_status: "waiting"
                idempotency_mismatch:
                  summary: Idempotency key used with different parameters
                  value:
                    error:
                      type: "idempotency_error"
                      code: "idempotency_key_mismatch"
                      message: "Idempotency key was previously used with different request parameters"
                      param: "idempotency_key"
                      details:
                        original_request_at: "2025-11-14T12:00:00.000Z"
        '500':
          $ref: '#/components/responses/ServerError'

  /v3/invoices:
    get:
      tags:
        - Invoices
      summary: List invoices
      description: |
        Retrieve a paginated list of invoices with optional filtering and sorting.

        **Pagination:** Uses cursor-based pagination with `limit` and `starting_after` parameters.

        **Filtering:** Filter by status, date range, order_id, amount range, and asset.
      operationId: listInvoices
      parameters:
        - name: status
          in: query
          description: Filter by invoice status
          required: false
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: order_id
          in: query
          description: Filter by merchant order ID
          required: false
          schema:
            type: string
            maxLength: 255
        - name: created_after
          in: query
          description: Filter invoices created after this timestamp (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
          example: "2025-11-01T00:00:00.000Z"
        - name: created_before
          in: query
          description: |
            Filter invoices created before this timestamp (ISO 8601 UTC).
            If both created_after and created_before provided, created_after must be earlier.
          required: false
          schema:
            type: string
            format: date-time
          example: "2025-11-30T23:59:59.999Z"
        - name: amount_gte
          in: query
          description: Filter invoices with amount greater than or equal to this value
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
          example: "10.00"
        - name: amount_lte
          in: query
          description: |
            Filter invoices with amount less than or equal to this value.
            If both amount_gte and amount_lte provided, amount_gte must be <= amount_lte.
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
          example: "1000.00"
        - name: asset
          in: query
          description: Filter by asset symbol
          required: false
          schema:
            type: string
          example: "USDC"
        - name: limit
          in: query
          description: Maximum number of invoices to return (1-100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: starting_after
          in: query
          description: |
            Cursor for pagination. Use the next_cursor value from previous response.
            Cursors are opaque strings. Changing sort order invalidates existing cursors.
          required: false
          schema:
            type: string
          example: "inv_xyz789"
        - name: sort
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum:
              - created_at:asc
              - created_at:desc
              - updated_at:asc
              - updated_at:desc
              - amount:asc
              - amount:desc
            default: created_at:desc
        - name: include_transactions
          in: query
          description: Include incoming payment transactions for each invoice in response (excludes refund and settlement transactions)
          required: false
          schema:
            type: boolean
            default: false
        - name: include_refunds
          in: query
          description: Include full refund objects for each invoice in response
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of invoices retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/InvoiceList'
              example:
                result:
                  data:
                    - id: "01234567-89ab-cdef-0123-456789abcdef"
                      order_id: "shop-order-12345"
                      amount: "100.50"
                      asset: "USDC"
                      status: "paid"
                      payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                      payment_url: "https://mega-merchant.kalatori.org/01234567-89ab-cdef-0123-456789abcdef"
                      valid_till: "2025-11-15T12:00:00.000Z"
                      total_received: "100.50"
                      refunds_ids: []
                      created_at: "2025-11-14T12:00:00.000Z"
                      updated_at: "2025-11-14T12:15:30.000Z"
                    - id: "fedcba98-7654-3210-fedc-ba9876543210"
                      order_id: "shop-order-12344"
                      amount: "50.00"
                      asset: "USDC"
                      status: "paid"
                      payment_address: "5DTestGXxxbXG6QL4N7KkeYmJRRkuLwPmLPJ8oRXTrqwJGqf"
                      payment_url: "https://mega-merchant.kalatori.org/fedcba98-7654-3210-fedc-ba9876543210"
                      valid_till: "2025-11-14T11:30:00.000Z"
                      total_received: "50.00"
                      refunds_ids: []
                      created_at: "2025-11-14T11:00:00.000Z"
                      updated_at: "2025-11-14T11:15:00.000Z"
                  has_more: true
                  next_cursor: "inv_xyz789"
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /v3/invoice/update:
    post:
      tags:
        - Invoices
      summary: Update invoice
      description: |
        Update an invoice. Only invoices in `waiting` status can be updated.

        **Updateable fields:**
        - `callback_url` - Webhook URL
        - `amount` - Payment amount
        - `cart` - Cart items

        **Note:** The `valid_till` field is automatically updated on each update request.
      operationId: updateInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
            example:
              invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
              callback_url: "https://newshop.com/webhooks/kalatori"
              amount: "120.00"
              cart:
                - name: "Premium Widget"
                  quantity: 3
                  price: "40.00"
      responses:
        '200':
          description: Invoice updated successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
        '400':
          description: Invalid request or invoice cannot be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_status:
                  summary: Invoice not in waiting status
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_invoice_status"
                      message: "Only invoices with 'waiting' status can be updated. Current status: paid"
                      param: "invoice_id"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /v3/invoice/cancel:
    post:
      tags:
        - Invoices
      summary: Cancel invoice
      description: |
        Cancel an invoice. If the invoice has received partial payment, a refund will be automatically initiated.

        **Valid statuses for cancellation:**
        - `waiting` - No refund needed
        - `partially_paid` - Automatic refund initiated
      operationId: cancelInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInvoiceRequest'
            example:
              invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
              reason: "customer_request"
      responses:
        '200':
          description: Invoice canceled successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
              example:
                result:
                  id: "01234567-89ab-cdef-0123-456789abcdef"
                  order_id: "shop-order-12345"
                  status: "admin_canceled"
                  amount: "100.50"
                  asset: "USDC"
                  payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                  payment_url: "https://mega-merchant.kalatori.org/01234567-89ab-cdef-0123-456789abcdef"
                  valid_till: "2025-11-15T12:00:00.000Z"
                  total_received: "0.00"
                  refunds_ids: []
                  transactions: []
                  created_at: "2025-11-14T12:00:00.000Z"
                  updated_at: "2025-11-14T13:00:00.000Z"
        '400':
          description: Invoice cannot be canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_paid:
                  summary: Invoice already paid
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_invoice_status"
                      message: "Cannot cancel invoice with status 'paid'"
                      param: "invoice_id"
                already_canceled:
                  summary: Invoice already canceled
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_invoice_status"
                      message: "Invoice is already canceled"
                      param: "invoice_id"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /v3/invoice/approve:
    post:
      tags:
        - Invoices
      summary: Admin approve invoice
      description: |
        Manually approve an invoice regardless of payment status. Typically used for:
        - Accepting underpaid invoices
        - Handling off-chain payment arrangements
        - Resolving payment disputes

        Note: All authenticated users can perform this operation in V3.
      operationId: approveInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveInvoiceRequest'
            example:
              invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
      responses:
        '200':
          description: Invoice approved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
              example:
                result:
                  id: "01234567-89ab-cdef-0123-456789abcdef"
                  order_id: "shop-order-12345"
                  status: "admin_approved"
                  amount: "100.50"
                  asset: "USDC"
                  payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                  payment_url: "https://mega-merchant.kalatori.org/01234567-89ab-cdef-0123-456789abcdef"
                  valid_till: "2025-11-15T12:00:00.000Z"
                  total_received: "95.00"
                  refunds_ids: []
                  created_at: "2025-11-14T12:00:00.000Z"
                  updated_at: "2025-11-14T13:30:00.000Z"
        '400':
          description: Invoice cannot be approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /v3/refund:
    get:
      tags:
        - Refunds
      summary: Get refund by ID
      description: Retrieve details of a specific refund
      operationId: getRefund
      parameters:
        - name: refund_id
          in: query
          description: The refund UUID
          required: true
          schema:
            type: string
            format: uuid
          example: "11111111-2222-3333-4444-555555555555"
        - name: include_transactions
          in: query
          description: Include transaction history in response
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Refund retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Refund'
              example:
                result:
                  id: "11111111-2222-3333-4444-555555555555"
                  invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
                  amount: "10.00"
                  asset: "USDC"
                  source_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                  destination_address: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
                  status: "completed"
                  initiator_type: "admin"
                  created_at: "2025-11-14T13:00:00.000Z"
                  updated_at: "2025-11-14T13:05:00.000Z"
        '400':
          description: Missing or invalid refund_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Refund not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - Refunds
      summary: Initiate refund
      description: |
        Create a refund for an invoice. Refunds can be partial (specific amount) or full.

        **Auto-refund behavior:**
        - If `destination_address` is not provided, the refund will be automatically sent to
          the sender address from the invoice's transaction history.
        - If the invoice has no transaction history (no payments received), the request will fail.
        - Manual destination address can be specified to override auto-refund behavior.

        **Refund sources:**
        - Payment address (if funds still present)
        - Reserve account (if payment address is empty)

        **Requirements:**
        - Invoice must exist
        - Amount must be specified and available
        - If destination_address not provided, invoice must have transaction history
      operationId: initiateRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
            examples:
              manual_destination:
                summary: Refund with manual destination address
                value:
                  invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
                  amount: "10.00"
                  destination_address: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
              auto_refund:
                summary: Auto-refund to sender (no destination specified)
                value:
                  invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
                  amount: "10.00"
      responses:
        '201':
          description: Refund initiated successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Refund'
              example:
                result:
                  id: "11111111-2222-3333-4444-555555555555"
                  invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
                  amount: "10.00"
                  asset: "USDC"
                  source_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                  destination_address: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
                  status: "waiting"
                  initiator_type: "admin"
                  created_at: "2025-11-14T13:00:00.000Z"
                  updated_at: "2025-11-14T13:00:00.000Z"
        '400':
          description: Invalid refund request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_balance:
                  summary: Insufficient balance for refund
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "insufficient_balance"
                      message: "Payment address balance (5.00 USDC) is less than refund amount (10.00 USDC)"
                      param: "amount"
                invalid_address:
                  summary: Invalid destination address
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_address"
                      message: "Destination address is not a valid Substrate address"
                      param: "destination_address"
                invalid_invoice_status:
                  summary: Cannot refund canceled invoice
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_invoice_status"
                      message: "Cannot create refund for invoice with status 'admin_canceled'"
                      param: "invoice_id"
                auto_refund_no_sender:
                  summary: Auto-refund failed - no transaction history
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "missing_sender_address"
                      message: "Cannot auto-refund: invoice has no transaction history. Please provide destination_address."
                      param: "destination_address"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /v3/refunds:
    get:
      tags:
        - Refunds
      summary: List refunds
      description: |
        Retrieve a paginated list of refunds with optional filtering and sorting.

        **Pagination:** Uses cursor-based pagination with `limit` and `starting_after` parameters.

        **Filtering:** Filter by invoice, status, date range, and amount range.
      operationId: listRefunds
      parameters:
        - name: invoice_id
          in: query
          description: Filter refunds by invoice UUID
          required: false
          schema:
            type: string
            format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
        - name: status
          in: query
          description: Filter by refund status
          required: false
          schema:
            $ref: '#/components/schemas/RefundStatus'
        - name: created_after
          in: query
          description: Filter refunds created after this timestamp (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
          example: "2025-11-01T00:00:00.000Z"
        - name: created_before
          in: query
          description: |
            Filter refunds created before this timestamp (ISO 8601 UTC).
            If both created_after and created_before provided, created_after must be earlier.
          required: false
          schema:
            type: string
            format: date-time
          example: "2025-11-30T23:59:59.999Z"
        - name: amount_gte
          in: query
          description: Filter refunds with amount greater than or equal to this value
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
          example: "10.00"
        - name: amount_lte
          in: query
          description: |
            Filter refunds with amount less than or equal to this value.
            If both amount_gte and amount_lte provided, amount_gte must be <= amount_lte.
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
          example: "1000.00"
        - name: limit
          in: query
          description: Maximum number of refunds to return (1-100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: starting_after
          in: query
          description: |
            Cursor for pagination. Use the next_cursor value from previous response.
            Cursors are opaque strings. Changing sort order invalidates existing cursors.
          required: false
          schema:
            type: string
          example: "ref_xyz789"
        - name: sort
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum:
              - created_at:asc
              - created_at:desc
              - updated_at:asc
              - updated_at:desc
              - amount:asc
              - amount:desc
            default: created_at:desc
        - name: include_transactions
          in: query
          description: Include transaction history for each refund in response
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of refunds retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/RefundList'
              example:
                result:
                  data:
                    - id: "11111111-2222-3333-4444-555555555555"
                      invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
                      amount: "10.00"
                      asset: "USDC"
                      source_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                      destination_address: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
                      status: "completed"
                      initiator_type: "system"
                      created_at: "2025-11-14T13:00:00.000Z"
                      updated_at: "2025-11-14T13:05:00.000Z"
                    - id: "22222222-3333-4444-5555-666666666666"
                      invoice_id: "fedcba98-7654-3210-fedc-ba9876543210"
                      amount: "5.00"
                      asset: "USDC"
                      source_address: "5DTestGXxxbXG6QL4N7KkeYmJRRkuLwPmLPJ8oRXTrqwJGqf"
                      destination_address: "5HpG9w8EBLe5XCrbczpwq5TSXvedjrBGCwqxK1iQ7qUsSWFc"
                      status: "completed"
                      initiator_type: "admin"
                      created_at: "2025-11-14T14:00:00.000Z"
                      updated_at: "2025-11-14T14:05:00.000Z"
                  has_more: false
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

