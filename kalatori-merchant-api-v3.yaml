servers:
  - url: http://localhost:16726
    description: Local development server
  - url: https://api.kalatori.example.com
    description: Production server (example)

security:
  - HmacAuth: []

tags:
  - name: Invoices
    description: Invoice creation, retrieval, and management operations
  - name: Public
    description: Public endpoints for serving payment pages and serving public invoice details

paths:
  /private/v3/invoice/get:
    get:
      tags:
        - Invoices
      summary: Get invoice by ID
      description: |
        Retrieve a single invoice by invoice_id.
      operationId: getInvoice
      parameters:
        - name: invoice_id
          in: query
          description: The Kalatori-generated invoice UUID
          required: true
          schema:
            type: string
            format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
        - name: include_transactions
          in: query
          description: Include incoming payment transactions in response (excludes refund and settlement transactions)
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Invoice retrieved successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique request identifier for debugging
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
              examples:
                waiting:
                  summary: Invoice waiting for payment
                  value:
                    result:
                      id: "01234567-89ab-cdef-0123-456789abcdef"
                      order_id: "shop-order-12345"
                      amount: "100.50"
                      asset: "USDC"
                      asset_id: "1337"
                      chain: "Polkadot Asset Hub"
                      status: "Waiting"
                      payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                      payment_url: "https://mega-merchant.kalatori.org?invoice_id=01234567-89ab-cdef-0123-456789abcdef"
                      redirect_url: "https://myshop.com/order-complete"
                      valid_till: "2025-11-15T12:00:00.000Z"
                      cart:
                        - name: "Premium Widget"
                          quantity: 2
                          price: "45.00"
                        - name: "Shipping"
                          quantity: 1
                          price: "10.50"
                      total_received_amount: "0.00"
                      transactions: []
                      created_at: "2025-11-14T12:00:00.000Z"
                      updated_at: "2025-11-14T12:00:00.000Z"
                paid:
                  summary: Invoice paid
                  value:
                    result:
                      id: "01234567-89ab-cdef-0123-456789abcdef"
                      order_id: "shop-order-12345"
                      amount: "100.50"
                      asset: "USDC"
                      asset_id: "1337"
                      chain: "Polkadot Asset Hub"
                      status: "Paid"
                      payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                      payment_url: "https://mega-merchant.kalatori.org?invoice_id=01234567-89ab-cdef-0123-456789abcdef"
                      redirect_url: "https://myshop.com/order-complete"
                      valid_till: "2025-11-15T12:00:00.000Z"
                      cart:
                        - name: "Premium Widget"
                          quantity: 2
                          price: "45.00"
                        - name: "Shipping"
                          quantity: 1
                          price: "10.50"
                      total_received_amount: "100.50"
                      transactions: []
                      created_at: "2025-11-14T12:00:00.000Z"
                      updated_at: "2025-11-14T12:15:30.000Z"
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_param:
                  summary: Missing required parameter
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "missing_parameter"
                      message: "invoice_id must be provided"
                invalid_uuid:
                  summary: Malformed UUID
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_parameter"
                      message: "invoice_id must be a valid UUID"
                      param: "invoice_id"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  type: "invalid_request_error"
                  code: "invoice_not_found"
                  message: "No invoice found with the provided ID"
                  param: "invoice_id"
        '500':
          $ref: '#/components/responses/ServerError'

  /private/v3/invoice/create:
    post:
      tags:
        - Invoices
      summary: Create new invoice
      description: |
        Create a new payment invoice. The invoice_id (UUID) is generated by Kalatori, while order_id is provided by the merchant.

        **Validation:**
        - Amount must be >= existential deposit (typically 0.07 for most assets)
        - No other invoice with the same order_id can exist (order_id must be globally unique)
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
            examples:
              minimal:
                summary: Minimal invoice creation
                value:
                  order_id: "shop-order-12345"
                  amount: "100.50"
              with_cart:
                summary: Invoice with cart items (including optional fields)
                value:
                  order_id: "shop-order-12346"
                  amount: "250.00"
                  cart:
                    - name: "Premium Widget"
                      quantity: 2
                      price: "100.00"
                      product_url: "https://myshop.com/product/prod_abc123"
                      image_url: "https://myshop.com/images/premium-widget.jpg"
                      tax: "20.00"
                      discount: "10.00"
                    - name: "Standard Widget"
                      quantity: 5
                      price: "10.00"
                      product_url: "https://myshop.com/product/prod_xyz789"
      responses:
        '201':
          description: Invoice created successfully
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique request identifier
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
              example:
                result:
                  id: "01234567-89ab-cdef-0123-456789abcdef"
                  order_id: "shop-order-12345"
                  amount: "100.50"
                  asset: "USDC"
                  asset_id: "1337"
                  chain: "Polkadot Asset Hub"
                  status: "Waiting"
                  payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                  payment_url: "https://mega-merchant.kalatori.org?invoice_id=01234567-89ab-cdef-0123-456789abcdef"
                  redirect_url: "https://myshop.com/order-complete"
                  valid_till: "2025-11-15T12:00:00.000Z"
                  cart:
                    - name: "Premium Widget"
                      quantity: 2
                      price: "45.00"
                      image_url: "https://myshop.com/images/premium-widget.jpg"
                      tax: "4.50"
                    - name: "Shipping"
                      quantity: 1
                      price: "10.50"
                  total_received_amount: "0.00"
                  transactions: []
                  created_at: "2025-11-14T12:00:00.000Z"
                  updated_at: "2025-11-14T12:00:00.000Z"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                amount_too_low:
                  summary: Amount below existential deposit
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "amount_too_low"
                      message: "Amount must be at least 0.07 USDC to cover existential deposit"
                      param: "amount"
                validation_failed:
                  summary: Multiple validation errors
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "validation_failed"
                      message: "Request validation failed"
                      validation_errors:
                        - param: "order_id"
                          message: "order_id cannot be empty"
                        - param: "amount"
                          message: "amount must be a positive number"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Conflict - duplicate order_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicate_order:
                  summary: Order ID already exists
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "duplicate_order_id"
                      message: "An invoice with order_id 'shop-order-12345' already exists"
                      param: "order_id"
                      details:
                        existing_invoice_id: "fedcba98-7654-3210-fedc-ba9876543210"
                        existing_status: "Waiting"
        '500':
          $ref: '#/components/responses/ServerError'

  /private/v3/invoice/update:
    post:
      tags:
        - Invoices
      summary: Update invoice
      description: |
        Update an invoice. Only invoices in `waiting` status can be updated.

        **Updateable fields:**
        - `amount` - Payment amount
        - `cart` - Cart items

        **Note:** The `valid_till` field is automatically updated on each update request.
      operationId: updateInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
            example:
              invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
              amount: "120.00"
              cart:
                - name: "Premium Widget"
                  quantity: 3
                  price: "40.00"
      responses:
        '200':
          description: Invoice updated successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
        '400':
          description: Invalid request or invoice cannot be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_status:
                  summary: Invoice not in waiting status
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_invoice_status"
                      message: "Only invoices with 'Waiting' status can be updated. Current status: Paid"
                      param: "invoice_id"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /private/v3/invoice/cancel:
    post:
      tags:
        - Invoices
      summary: Cancel invoice
      description: |
        Cancel an invoice. If the invoice has received partial payment, a refund will be automatically initiated.

        **Valid statuses for cancellation:**
        - `Waiting` - No refund needed
        - `PartiallyPaid` - Automatic refund initiated
      operationId: cancelInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInvoiceRequest'
            example:
              invoice_id: "01234567-89ab-cdef-0123-456789abcdef"
              reason: "customer_request"
      responses:
        '200':
          description: Invoice canceled successfully
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
              example:
                result:
                  id: "01234567-89ab-cdef-0123-456789abcdef"
                  order_id: "shop-order-12345"
                  status: "AdminCanceled"
                  amount: "100.50"
                  asset: "USDC"
                  asset_id: "1337"
                  chain: "Polkadot Asset Hub"
                  payment_address: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
                  payment_url: "https://mega-merchant.kalatori.org/01234567-89ab-cdef-0123-456789abcdef"
                  redirect_url: "https://myshop.com/order-complete"
                  valid_till: "2025-11-15T12:00:00.000Z"
                  cart: []
                  total_received_amount: "0.00"
                  transactions: []
                  created_at: "2025-11-14T12:00:00.000Z"
                  updated_at: "2025-11-14T13:00:00.000Z"
        '400':
          description: Invoice cannot be canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_paid:
                  summary: Invoice already paid
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_invoice_status"
                      message: "Cannot cancel invoice with status 'paid'"
                      param: "invoice_id"
                already_canceled:
                  summary: Invoice already canceled
                  value:
                    error:
                      type: "invalid_request_error"
                      code: "invalid_invoice_status"
                      message: "Invoice is already canceled"
                      param: "invoice_id"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
  /public:
    get:
      tags:
        - Public
      summary: Serve front-end payment page
      description: |
        Serve the Kalatori-hosted payment page for customers to complete payment using wallet integrations.
        URL to this page is provided in the `payment_url` field of the `Invoice`.
      operationId: servePaymentPage
      parameters:
        - name: invoice_id
          in: query
          description: The Kalatori-generated invoice UUID
          required: true
          schema:
            type: string
            format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
      responses:
        '200':
          description: Payment page HTML
          content:
            text/html:
              schema:
                type: string

  /public/invoice:
    get:
      tags:
        - Public
      summary: Get public invoice details
      description: |
        Retrieve public invoice details for displaying on the payment page.

        **Note:** This endpoint will only return 200 OK if the invoice exists and is in `Waiting` or `PartiallyPaid` status.
        If the invoice is `Paid`, `AdminCanceled` or any other status, a 404 Not Found response will be returned.
      operationId: getPublicInvoice
      parameters:
        - name: invoice_id
          in: query
          description: The Kalatori-generated invoice UUID
          required: true
          schema:
            type: string
            format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
      responses:
        '200':
          description: Public invoice details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/Invoice'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    HmacAuth:
      type: apiKey
      in: header
      name: X-Kalatori-Signature
      description: |
        HMAC-SHA256 signature authentication.

        Required headers:
        - `X-Kalatori-Signature`: HMAC-SHA256 hex signature
        - `X-Kalatori-Timestamp`: Unix timestamp in seconds (integer)

        **Signature Calculation:**

        The signature is created by concatenating specific request components with newline delimiters:

        ```
        signed_payload = HTTP_METHOD + "\n" + URL + "\n" + body_or_query + "\n" + timestamp
        signature = HMAC_SHA256(secret, signed_payload)
        ```

        **Components:**
        - `HTTP_METHOD` = Request method in uppercase (e.g., "GET", "POST", "PATCH")
        - `URL` = Full path without query string (e.g., "/private/v3/invoice/get")
        - `body_or_query` = Either:
          - For POST/PATCH: Raw JSON request body as string
          - For GET: Query parameters sorted alphabetically by key (e.g., "amount=100.00&order_id=order-123"), or empty string if no parameters
        - `timestamp` = Unix timestamp in seconds from X-Kalatori-Timestamp header

        **Query Parameter Sorting:**
        For GET requests, query parameters must be:
        1. Sorted alphabetically by parameter name (case-sensitive)
        2. Formatted as `key=value` pairs joined with `&`
        3. Exclude the `?` prefix

        **Validation:**
        - Timestamp must be within ±5 minutes of server time
        - Use constant-time comparison for signature verification
        - HMAC secret configured in Kalatori config file

  schemas:
    Invoice:
      type: object
      required:
        - id
        - order_id
        - asset
        - asset_id
        - chain
        - amount
        - payment_address
        - status
        - payment_url
        - redirect_url
        - cart
        - valid_till
        - total_received_amount
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Kalatori-generated invoice UUID
          example: "01234567-89ab-cdef-0123-456789abcdef"
        order_id:
          type: string
          maxLength: 255
          description: Merchant's order identifier
          example: "shop-order-12345"
        asset:
          type: string
          description: Asset symbol (e.g., USDC, USDT, DOT)
          example: "USDC"
        asset_id:
          type: string
          description: Asset unique identifier on the chain
          example: "1337"
        chain:
          type: string
          description: Blockchain network name
          example: "Polkadot Asset Hub"
        amount:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Expected payment amount (decimal string for precision)
          example: "100.50"
        payment_address:
          type: string
          description: Unique payment address for this invoice (Substrate ss58 format)
          example: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        payment_url:
          type: string
          format: uri
          description: |
            URL to Kalatori-hosted payment page for this invoice.
            Customers can use this page to complete payment with wallet integrations.
            This URL is only valid until valid_till expiration time.
          example: "https://mega-merchant.kalatori.org?invoice_id=01234567-89ab-cdef-0123-456789abcdef"
        redirect_url:
          type: string
          format: uri
          description: |
            URL to redirect the customer to after successful payment.
            Configured by the merchant in the daemon config file.
          example: "https://myshop.com/thank-you"
        valid_till:
          type: string
          format: date-time
          description: |
            Invoice expiration timestamp (ISO 8601 UTC).
            Calculated as current_time + configured invoice lifetime on creation.
            Updating an invoice refreshes valid_till to now + invoice lifetime.
            After expiration, payment address stops accepting payments.
          example: "2025-11-15T12:00:00.000Z"
        cart:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          description: Optional cart items for display on payment page
        total_received_amount:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Total amount received so far
          example: "100.50"
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
          description: |
            Optional list of incoming payment transactions received for this invoice.
            Only included when `include_transactions=true` is requested (query parameter for GET, request body field for POST/PATCH).
            Excludes refund and settlement transactions. Useful for payment verification and proof of payment.
        created_at:
          type: string
          format: date-time
          description: Invoice creation timestamp
          example: "2025-11-14T12:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-11-14T12:15:30.000Z"

    CreateInvoiceRequest:
      type: object
      required:
        - order_id
        - amount
      properties:
        order_id:
          type: string
          maxLength: 255
          minLength: 1
          description: Merchant's unique order identifier
          example: "shop-order-12345"
        amount:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Payment amount (must be >= existential deposit)
          example: "100.50"
        cart:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          description: Optional cart items for payment page display
        include_transactions:
          type: boolean
          default: false
          description: Include incoming payment transactions in response (excludes refund and settlement transactions)
      description: |
        Create invoice request.

        Note: The asset type (USDC, USDT, DOT, etc.) is configured per daemon instance.
        All invoices use the configured asset. Contact your daemon administrator if you
        need to accept payments in different assets.

    UpdateInvoiceRequest:
      type: object
      required:
        - invoice_id
      properties:
        invoice_id:
          type: string
          format: uuid
          description: Invoice UUID to update
          example: "01234567-89ab-cdef-0123-456789abcdef"
        amount:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: New payment amount
          example: "120.00"
        cart:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          description: Updated cart items
        include_transactions:
          type: boolean
          default: false
          description: Include incoming payment transactions in response (excludes refund and settlement transactions)

    CancelInvoiceRequest:
      type: object
      required:
        - invoice_id
      properties:
        invoice_id:
          type: string
          format: uuid
          description: Invoice UUID to cancel
          example: "01234567-89ab-cdef-0123-456789abcdef"
        reason:
          type: string
          maxLength: 500
          description: Optional cancellation reason
          example: "customer_request"
        include_transactions:
          type: boolean
          default: false
          description: Include incoming payment transactions in response (excludes refund and settlement transactions)

    CartItem:
      type: object
      required:
        - name
        - quantity
        - price
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Item name
          example: "Premium Widget"
        quantity:
          type: integer
          minimum: 1
          description: Item quantity
          example: 2
        price:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Unit price (decimal string). Zero-price items are allowed.
          example: "45.00"
        product_url:
          type: string
          maxLength: 255
          description: Optional product link on e-commerce platform
          example: "prod_abc123"
        image_url:
          type: string
          format: uri
          maxLength: 2048
          description: Optional product image URL for display on payment page
          example: "https://myshop.com/images/premium-widget.jpg"
        tax:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Optional tax amount for this line item
          example: "2.50"
        discount:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Optional discount amount applied to this line item
          example: "5.00"

    InvoiceStatus:
      type: string
      enum:
        - Waiting
        - PartiallyPaid
        - Paid
        - Overpaid
        - UnpaidExpired
        - PartiallyPaidExpired
        - CustomerCanceled
        - AdminCanceled
      description: |
        Invoice payment status:
        - `Waiting` - Awaiting payment
        - `PartiallyPaid` - Received payment less than amount. Customer can send additional payments to same address.
        - `Paid` - Received payment equal to amount. Funds withdrawn to merchant.
        - `Overpaid` - Received more than amount. Invoice amount withdrawn, excess refunded automatically.
        - `UnpaidExpired` - Expired without any payment
        - `PartiallyPaidExpired` - Expired with partial payment (refundable)
        - `CustomerCanceled` - Canceled by customer action
        - `AdminCanceled` - Canceled by merchant/admin. Partial payments refunded automatically.

    Transaction:
      type: object
      required:
        - id
        - invoice_id
        - block_number
        - position_in_block
        - tx_hash
        - transaction_type
        - asset
        - asset_id
        - chain
        - amount
        - source_address
        - destination_address
        - status
        - created_at
        - updated_at
        - transaction_link
      properties:
        id:
          type: string
          format: uuid
          description: Unique transaction identifier
          example: "01234567-89ab-cdef-0123-456789abcdef"
        invoice_id:
          type: string
          format: uuid
          description: Associated invoice UUID
          example: "01234567-89ab-cdef-0123-456789abcdef"
        block_number:
          type: integer
          description: Block number where transaction was included
          example: 1234567
        position_in_block:
          type: integer
          description: Transaction's position/index within the block
          example: 5
        tx_hash:
          type: string
          description: Blockchain transaction hash
          example: "0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
        transaction_type:
          type: string
          enum:
            - Incoming
            - Outgoing
          description: |
            Transaction type:
            - `Incoming` - Payment received to invoice address
            - `Outgoing` - Refund or settlement sent from invoice address
          example: "Incoming"
        asset:
          type: string
          description: Asset symbol (e.g., USDC, USDT, DOT)
          example: "USDC"
        asset_id:
          type: string
          description: Asset unique identifier on the chain
          example: "1337"
        chain:
          type: string
          description: Blockchain network name
          example: "Polkadot Asset Hub"
        amount:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Transaction amount (decimal string for precision)
          example: "100.50"
        source_address:
          type: string
          description: Address that sent the payment (Substrate ss58 format)
          example: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
        destination_address:
          type: string
          description: Payment address that received the funds (invoice payment address, Substrate ss58 format)
          example: "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
        created_at:
          type: string
          format: date-time
          description: Transaction timestamp
          example: "2025-11-14T12:10:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: Transaction timestamp
          example: "2025-11-14T12:10:00.000Z"
        status:
          type: string
          enum:
            - Waiting
            - InProgress
            - Completed
            - Failed
          description: |
            Transaction processing status:
            - `Waiting` - Transaction created but not yet submitted to blockchain
            - `InProgress` - Transaction submitted and awaiting finalization
            - `Completed` - Transaction finalized on blockchain
            - `Failed` - Transaction failed to complete
          example: "Completed"
        transaction_link:
          type: string
          format: uri
          description: |
            Link to blockchain explorer (subscan.io) for this transaction.
            The subdomain depends on the configured chain (e.g., assethub-polkadot, assethub-kusama).
          example: "https://assethub-polkadot.subscan.io/extrinsic/0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
          properties:
            type:
              type: string
              enum:
                - authentication_error
                - invalid_request_error
                - api_error
              description: Error category
            code:
              type: string
              description: Machine-readable error code
              example: "amount_too_low"
            message:
              type: string
              description: Human-readable error message
              example: "Amount must be at least 0.07 USDC"
            param:
              type: string
              description: The parameter that caused the error (if applicable)
              example: "amount"
            details:
              type: object
              description: Additional error context (optional)
              additionalProperties: true
            validation_errors:
              type: array
              description: Multiple validation errors (if applicable)
              items:
                type: object
                required:
                  - param
                  - message
                properties:
                  param:
                    type: string
                    description: Parameter name
                  message:
                    type: string
                    description: Validation error message

  responses:
    UnauthorizedError:
      description: Authentication failed - invalid or missing signature
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Unique request identifier for debugging
          example: "req_auth1"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_signature:
              summary: Invalid signature
              value:
                error:
                  type: "authentication_error"
                  code: "invalid_signature"
                  message: "HMAC signature verification failed"
            timestamp_expired:
              summary: Timestamp too old
              value:
                error:
                  type: "authentication_error"
                  code: "timestamp_expired"
                  message: "Request timestamp is outside the allowed window (±5 minutes)"

    ServerError:
      description: Internal server error
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Unique request identifier for debugging
          example: "req_server1"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: "api_error"
              code: "internal_server_error"
              message: "An internal server error occurred. Please try again later or contact support with X-Request-Id header."
